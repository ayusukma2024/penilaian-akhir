<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Nilai Akuntansi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: fixed deep-navy sidebar, light content area, coloured stat tiles on top, panels with tables and donut charts below (same structure as the reference dashboard). */
:root{
  --bg:#eaf0f8; --surface:#ffffff; --ink:#18233f; --muted:#667391; --line:#e0e7f1; --row:#f2f5fa; --field:#ffffff;
  --navy:#16264f; --navy-hi:#2d8cf0; --navy-ink:#b9c4e0; --navy-line:#2b3c6c;
  --blue:#1f6fd1; --green:#2a8f17; --orange:#d96207; --red:#d9143b; --yellow:#f0c93a; --purple:#6e51b6; --deep:#2c3f78;
  --focus:#2d8cf0;
  --good-bg:#e3f4dd; --good-ink:#226b12; --warn-bg:#ffefdc; --warn-ink:#9a4a00; --bad-bg:#fde2e8; --bad-ink:#a80f2c; --info-bg:#e0edfc; --info-ink:#1a58ad;
  --shadow:0 1px 2px rgba(22,38,79,.06),0 6px 18px rgba(22,38,79,.06);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1427; --surface:#162039; --ink:#e6ecfa; --muted:#98a6c8; --line:#26335a; --row:#1a2644; --field:#0f1830;
  --navy:#0a1230; --navy-ink:#aab7da; --navy-line:#1d2a52;
  --blue:#3b8cf0; --green:#43b02a; --orange:#f0802a; --red:#ee3b5e; --yellow:#e6c23a; --purple:#8c73d6; --deep:#34498a;
  --good-bg:#17331a; --good-ink:#8fdc7a; --warn-bg:#3a2810; --warn-ink:#f6b36a; --bad-bg:#3b1722; --bad-ink:#ff93a9; --info-bg:#15294d; --info-ink:#8fc0fb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1427; --surface:#162039; --ink:#e6ecfa; --muted:#98a6c8; --line:#26335a; --row:#1a2644; --field:#0f1830;
  --navy:#0a1230; --navy-ink:#aab7da; --navy-line:#1d2a52;
  --blue:#3b8cf0; --green:#43b02a; --orange:#f0802a; --red:#ee3b5e; --yellow:#e6c23a; --purple:#8c73d6; --deep:#34498a;
  --good-bg:#17331a; --good-ink:#8fdc7a; --warn-bg:#3a2810; --warn-ink:#f6b36a; --bad-bg:#3b1722; --bad-ink:#ff93a9; --info-bg:#15294d; --info-ink:#8fc0fb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
em{color:var(--muted)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:6px;padding:9px 16px;font-weight:500;font-size:13px;background:var(--blue);color:#fff;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--row)}
.btn.green{background:var(--green)} .btn.red{background:var(--red)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.ib{width:28px;height:28px;border-radius:4px;border:0;display:inline-grid;place-items:center;color:#fff;background:var(--green)}
.ib.red{background:var(--red)} .ib.blue{background:var(--blue)}
.ib:hover{filter:brightness(1.1)}
.acts{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
label.l{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:13.5px}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.fg{display:grid;gap:14px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.err{background:var(--bad-bg);color:var(--bad-ink);border-radius:6px;padding:9px 12px;font-size:13px}
.note{background:var(--info-bg);color:var(--info-ink);border-radius:6px;padding:9px 12px;font-size:13px}
.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:9px 12px;font-size:13px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad-ink)} .pill.info{background:var(--info-bg);color:var(--info-ink)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.lbrand{background:var(--navy);color:#e9eefb;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:28px}
.logo{display:flex;align-items:center;gap:12px;font-weight:600;font-size:18px}
.logo i{width:38px;height:38px;border-radius:8px;background:var(--navy-hi);display:grid;place-items:center;color:#fff}
.lbrand h2{font-size:clamp(22px,3vw,30px);font-weight:600;line-height:1.3;max-width:20ch;text-wrap:balance}
.lbrand p{color:var(--navy-ink);max-width:44ch}
.lpts{display:grid;gap:12px;color:var(--navy-ink);font-size:13px;max-width:44ch}
.lpts div{display:flex;gap:12px;align-items:flex-start}
.lpts svg{flex:none;margin-top:2px;color:var(--navy-hi)}
.rules h3{font-size:15px;font-weight:600;color:#fff;margin:0 0 6px}
.rules h4{font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#dfe6f7;margin:16px 0 6px}
.rules ol{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--navy-ink);font-size:13px;max-width:46ch}
.rules li::marker{color:var(--navy-hi);font-weight:600}
.rmob{display:none}
.rmob summary{cursor:pointer;font-weight:500;color:#fff;font-size:13.5px;padding:2px 0}
.rmob[open] summary{margin-bottom:6px}
.lcard{display:grid;place-items:center;padding:32px 16px}
.lbox{width:100%;max-width:400px;display:grid;gap:16px}
.lbox h2{font-size:22px;font-weight:600}
.lbox .sub{color:var(--muted);font-size:13px;margin-top:-8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--row);border-radius:8px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:6px;padding:8px;font-weight:500;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.roles,.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc,.opts button{display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-weight:500;font-size:13.5px;color:var(--ink)}
.rc small,.opts small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.rc svg,.opts svg{flex:none;margin-top:1px;color:var(--muted)}
.rc.on,.opts button.on{background:var(--row)}
.rc.siswa.on,.opts button.on{border-color:var(--blue)} .rc.siswa.on svg,.opts button.on svg{color:var(--blue)}
.rc.guru.on{border-color:var(--purple)} .rc.guru.on svg{color:var(--purple)}
@media (max-width:420px){.roles,.opts{grid-template-columns:1fr}}
.switch{font-size:13px;color:var(--muted);text-align:center}
.switch button{background:none;border:0;color:var(--blue);font-weight:500;padding:0}

/* shell */
.side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--navy);color:var(--navy-ink);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;color:#fff;font-weight:600;font-size:15px}
.brand i{width:32px;height:32px;border-radius:7px;background:var(--navy-hi);display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--navy-ink)}
.ng{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#dfe6f7;padding:14px 10px 8px;border-bottom:1px solid var(--navy-line);margin-bottom:6px}
.ng small{display:block;text-transform:none;letter-spacing:0;color:#8e9cc4;font-size:11px;margin-top:1px}
.nv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--navy-ink);padding:10px 12px;border-radius:6px;font-size:13px;font-weight:500}
.nv:hover:not(.on):not([disabled]){background:rgba(255,255,255,.07)}
.nv.on{background:var(--navy-hi);color:#fff}
.nv[disabled]{opacity:.45;cursor:not-allowed}
.nv .cnt{margin-left:auto;background:var(--orange);color:#fff;border-radius:10px;font-size:11px;padding:0 8px;line-height:18px}
.main{margin-left:250px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px}
.ptitle{font-size:16px;font-weight:600;flex:1;min-width:0}
.ibm{display:none;border:1px solid var(--line);background:transparent;border-radius:6px;width:36px;height:36px;place-items:center}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none}
.who-t{display:grid;line-height:1.2;min-width:0}
.who-t b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-t small{color:var(--muted);font-size:11.5px}
.view{padding:20px;display:grid;gap:16px;max-width:1280px}
.scrim{display:none}

/* tiles / panels */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tile{border-radius:6px;color:#fff;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 12px}
.tile-val{font-size:22px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.tile-lbl{font-size:13px;opacity:.92}
.tile-ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.tile-foot{margin-top:auto;display:flex;gap:8px;align-items:center;padding:11px 18px;font-size:12.5px;background:rgba(0,0,0,.1)}
.t-blue{background:var(--blue)} .t-green{background:var(--green)} .t-orange{background:var(--orange)} .t-red{background:var(--red)} .t-deep{background:var(--deep)}
.panel{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);min-width:0}
.ph{padding:14px 20px;border-bottom:1px solid var(--line);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.pb{padding:16px 20px;min-width:0}
.g2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
.g2r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.75fr);gap:16px;align-items:start}
.empty{text-align:center;color:var(--muted);padding:22px 12px!important}
.page-h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.page-h h2{font-size:16px;font-weight:600}

/* tables */
.tsearch{display:flex;justify-content:flex-end;font-size:13px;margin-bottom:10px}
.tsearch input{margin-left:8px;border:1px solid var(--line);background:var(--field);border-radius:4px;padding:5px 9px;width:min(220px,60%)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;padding:10px 12px;border:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border:1px solid var(--line);vertical-align:middle}
.t tbody tr:nth-child(odd){background:var(--row)}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.t .nm{min-width:150px}
.t small{display:block;color:var(--muted);font-size:11.5px}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.pager{display:flex}
.pager button{border:1px solid var(--line);background:var(--surface);padding:5px 11px;font-size:12.5px;margin-left:-1px;color:var(--blue)}
.pager button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pager button[disabled]{color:var(--muted);cursor:not-allowed}

/* donut */
.dn{display:grid;gap:14px;justify-items:center}
.dn svg{width:min(210px,100%);height:auto}
.dn-c{fill:var(--ink);font-family:var(--font);font-weight:600;font-size:30px}
.dn-s{fill:var(--muted);font-family:var(--font);font-size:11px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:12px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* grading & LKPD */
.qcard .qt{font-weight:500;margin-bottom:12px;white-space:pre-wrap}
.ans-l{font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.ans{background:var(--row);border-radius:6px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.scr{display:flex;align-items:center;gap:10px;margin-top:14px}
.scr input{width:96px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-variant-numeric:tabular-nums}
.scr input.bad{border-color:var(--red)}
.sticky{position:sticky;top:calc(72px + env(safe-area-inset-top,0px))}
.big{font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.sumrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{height:8px;border-radius:8px;background:var(--row);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .2s}
.quote{border-left:3px solid var(--blue);background:var(--row);padding:12px 14px;border-radius:0 6px 6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:start}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red)}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}

@media (max-width:1100px){.g2,.g2r{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media (max-width:900px){
  .login{grid-template-columns:minmax(0,1fr)}
  .lbrand{padding:24px 20px;gap:14px}.rdesk{display:none}.rmob{display:block}
  .side{transform:translateX(-100%);transition:transform .2s}
  .menu-open .side{transform:none}
  .main{margin-left:0}
  .ibm{display:grid}
  .menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
  .view{padding:16px}.top{padding:10px 16px}
  .who-t{display:none}
  .qrow{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

  var snap=await wr(function(){return S.db.doc('users/'+(okUser(u)?u:'x-invalid')).get()});
  var d=snap.exists?snap.data():null;
  if(!d||!d.hash)throw 'Username atau sandi salah.';
  var h=await hashPw(password,d.salt);if(h!==d.hash)throw 'Username atau sandi salah.';

  return d;
}

  kelas=kelas||kelasList()[0];
  var id=slug(name).slice(0,50)+'-'+slug(kelas).slice(0,20);
  if(!/^[a-z0-9][a-z0-9-]{4,}$/.test(id))throw 'Nama hanya boleh berisi huruf dan angka.';
  var ref=S.db.doc('users/'+id);
  var ex=await wr(function(){return ref.get()});
  if(ex.exists&&ex.data()&&ex.data().username){var d0=ex.data();if(d0.role!=='siswa')throw 'Nama ini tidak bisa dipakai.';if(strict)throw 'Siswa ini sudah terdaftar di kelas tersebut.';return d0}
  var lease=await wr(function(){return ref.acquire({holder:S.holder,ttlMs:6000})});
  if(!lease.acquired)throw {code:'busy'};
  var ex2=await wr(function(){return ref.get()});
  if(ex2.exists&&ex2.data()&&ex2.data().username)return ex2.data();
  var data={username:id,name:name,nameKey:name.toLowerCase(),role:'siswa',kelas:kelas,salt:newSalt(),hash:newSalt()+newSalt(),createdAt:Date.now()};
  await wr(function(){return ref.set(data)});
  return data;
}
async function createUser(o){
  var u=normUser(o.username),name=String(o.name||'').trim();
  if(name.length<3)throw 'Nama lengkap minimal 3 karakter.';
  if(!okUser(u))throw 'Username 3–30 karakter: huruf kecil, angka, titik, garis bawah, atau strip.';
  if(String(o.password||'').length<6)throw 'Sandi minimal 6 karakter.';
  var ref=S.db.doc('users/'+u);
  var lease=await wr(function(){return ref.acquire({holder:S.holder,ttlMs:6000})});
  if(!lease.acquired)throw {code:'busy'};
  var ex=await wr(function(){return ref.get()});
  if(ex.exists&&ex.data()&&ex.data().username)throw {code:'exists'};
  var salt=newSalt(),hash=await hashPw(o.password,salt);
  var data={username:u,name:name,role:o.role,kelas:o.role==='siswa'?(o.kelas||kelasList()[0]):'',salt:salt,hash:hash,createdAt:Date.now()};
  await wr(function(){return ref.set(data)});
  return data;
}

document.addEventListener('submit',async function(e){

    return;
  }
  if(kind==='settings'){
    var kl=$('#s-kelas').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
    var data=Object.assign({},S.settings||{},{school:$('#s-school').value.trim()||'SMK Akuntansi',kelas:kl.length?kl:DEF_KELAS,updatedAt:Date.now()});
    try{await wr(function(){return S.db.doc('settings/app').set(data)});S.settings=data;toast('Pengaturan tersimpan.');render()}catch(er){toast(errMsg(er),true)}

    }catch(er){toast(errMsg(er),true)}
  }
});


/* ---------- database: Firebase Firestore (online) atau penyimpanan lokal ---------- */
function wrapSnap(id,exists,data,fromCache){return {id:id,exists:exists,data:function(){return exists?data:undefined},metadata:{fromCache:!!fromCache,hasPendingWrites:false}}}
function makeDb(){
  var cfg=window.FIREBASE_CONFIG;
  if(cfg&&window.firebase){
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    var fs=firebase.firestore();S.fbOn=true;
    var fsnap=function(x){return wrapSnap(x.id,x.exists,x.exists?x.data():undefined,x.metadata&&x.metadata.fromCache)};
    return {
      doc:function(p){var r=fs.doc(p);return {
        get:function(){return r.get().then(fsnap)},
        set:function(d){return r.set(d)},
        update:function(d){return r.update(d)},
        delete:function(){return r.delete()},
        acquire:function(){return Promise.resolve({acquired:true})},
        onSnapshot:function(n,e){return r.onSnapshot(function(x){n(fsnap(x))},e||function(){})}}},
      collection:function(p){var r=fs.collection(p);return {
        onSnapshot:function(n,e){return r.onSnapshot(function(x){n({docs:x.docs.map(fsnap)})},e||function(){})}}}
    };
  }

  var SB=window.SUPABASE_CONFIG;
  if(SB&&SB.url&&SB.key){
    S.fbOn=true;
    var base=String(SB.url).replace(/\/+$/,'')+'/rest/v1/kv',hd={apikey:SB.key,'Content-Type':'application/json'};
    if(String(SB.key).indexOf('eyJ')===0)hd.Authorization='Bearer '+SB.key;
    var ticks=[];
    var kick=function(){ticks.slice().forEach(function(f){f(true)})};
    var rq=function(url,opt){
      opt=opt||{};opt.headers=Object.assign({},hd,opt.headers||{});
      return fetch(url,opt).then(function(r){
        if(!r.ok)return r.text().then(function(t){throw {code:(r.status===401||r.status===403)?'permission-denied':'http_'+r.status,message:t}});
        return r.text().then(function(t){return t?JSON.parse(t):null});
      });
    };
    var enc=encodeURIComponent;
    var getRow=function(p){return rq(base+'?select=path,data&path=eq.'+enc(p)).then(function(rows){return rows&&rows.length?rows[0].data:undefined})};
    var putRow=function(p,d){return rq(base+'?on_conflict=path',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({path:p,data:d})}).then(function(){kick()})};
    var poll=function(fetcher,deliver){
      var last=null,dead=false;
      var f=function(force){
        if(dead||(!force&&document.hidden))return;

      };
      ticks.push(f);f(true);var iv=setInterval(f,4000);
      return function(){dead=true;clearInterval(iv);ticks=ticks.filter(function(x){return x!==f})};
    };
    return {
      doc:function(p){return {
        get:function(){return getRow(p).then(function(d){return wrapSnap(p.split('/').pop(),d!==undefined,d)})},
        set:function(d){return putRow(p,d)},
        update:function(d){return getRow(p).then(function(old){if(old===undefined)throw {code:'invalid_argument'};return putRow(p,Object.assign({},old,d))})},
        delete:function(){return rq(base+'?path=eq.'+enc(p),{method:'DELETE'}).then(function(){kick()})},
        acquire:function(){return Promise.resolve({acquired:true})},
        onSnapshot:function(n){return poll(function(){return getRow(p)},function(d){n(wrapSnap(p.split('/').pop(),d!==undefined,d))})}}},
      collection:function(c){return {onSnapshot:function(n){return poll(function(){
        return rq(base+'?select=path,data&path=like.'+enc(c+'/')+'*').then(function(rows){return (rows||[]).filter(function(r){return r.path.split('/').length===2}).map(function(r){return {path:r.path,data:r.data}})});
      },function(rows){n({docs:rows.map(function(r){return wrapSnap(r.path.split('/').pop(),true,r.data)})})})}}}
    };
  }
  S.fbOn=false;
  var KEY='enilai.local.v1',st={},subs=[];
  function load(){try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){st={}}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){throw {code:'quota_exceeded'}}}
  function notify(){subs.slice().forEach(function(f){f()})}
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function snapOf(p){return wrapSnap(p.split('/').pop(),Object.prototype.hasOwnProperty.call(st,p),st[p])}
  function listen(f){subs.push(f);setTimeout(f,0);return function(){subs=subs.filter(function(x){return x!==f})}}
  load();
  window.addEventListener('storage',function(e){if(e.key===KEY){load();notify()}});
  return {
    doc:function(p){return {
      get:function(){return Promise.resolve(snapOf(p))},
      set:function(d){try{st[p]=clone(d);save();notify();return Promise.resolve()}catch(e){return Promise.reject(e)}},
      update:function(d){if(!Object.prototype.hasOwnProperty.call(st,p))return Promise.reject({code:'invalid_argument'});try{st[p]=Object.assign({},st[p],clone(d));save();notify();return Promise.resolve()}catch(e){return Promise.reject(e)}},
      delete:function(){delete st[p];try{save()}catch(e){}notify();return Promise.resolve()},
      acquire:function(){return Promise.resolve({acquired:true})},
      onSnapshot:function(n){return listen(function(){n(snapOf(p))})}}},
    collection:function(c){return {onSnapshot:function(n){return listen(function(){
      n({docs:Object.keys(st).filter(function(k){return k.indexOf(c+'/')===0&&k.split('/').length===2}).map(snapOf)})})}}}
  };
}
function makeDl(){

}

}
